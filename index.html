    .keyboard-focus:focus-within {
      outline: none;
      box-shadow: 0 0 0 3px #2563eb;
    }
    @media print {
      body { background-color: white !important; padding: 0 !important; }

      .print\:block { display: block !important; }
      .print\:flex { display: flex !important; }
      #result-container { display: block !important; }
      #quiz-container, #restore-banner, #history-notice, footer { display: none !important; }

<body class="bg-gray-100 text-gray-800 min-h-screen py-8 px-4 font-sans antialiased">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md border border-gray-200 p-6 md:p-10 relative">
    
    <!-- 語言切換選單 + 頂部標識 -->
    <div class="flex justify-between items-center mb-6 pb-3 border-b border-gray-100">
      <span class="text-xs font-semibold tracking-wider text-gray-400 uppercase">Ipsative DISC Assessment</span>
      <div class="flex items-center gap-2">
        <label for="lang-select" class="text-xs text-gray-500 font-medium">Language / 語言:</label>
        <select id="lang-select" class="text-xs font-semibold border border-gray-300 rounded-lg px-2.5 py-1 bg-gray-50 text-gray-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
          <option value="zh" selected>繁體中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <!-- 歷史測評提示條 -->
    <div id="history-notice" class="hidden mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-xs text-blue-900 leading-relaxed print:hidden"></div>

    <!-- 雙選恢復草稿提示條 -->
    <div id="restore-banner" class="hidden mb-4 p-4 bg-green-50 border border-green-200 rounded-xl text-xs text-green-900 leading-relaxed print:hidden"></div>

    <!-- 黏性進度導航欄 -->
    <div class="sticky top-0 z-20 bg-white bg-opacity-95 backdrop-filter backdrop-blur-md py-3 -mx-6 px-6 md:-mx-10 md:px-10 mb-6 border-b border-gray-200 shadow-sm print:hidden">
      <div class="flex items-center gap-3">
        <div class="flex-1 bg-gray-200 rounded-full h-2.5 overflow-hidden">
          <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="progress-text" class="text-xs font-bold text-gray-600 whitespace-nowrap min-w-[85px] text-right">0 / 24</span>
        <select id="jump-select" class="text-xs border border-gray-300 rounded-lg px-2 py-1 bg-white text-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-500" aria-label="Jump to question"></select>
      </div>
      <div class="hidden sm:flex justify-between items-center text-[10px] text-gray-400 mt-2 px-1">
        <span id="keyboard-tip-text">全鍵盤流：按 Tab 聚焦題卡，按鍵 1-4 選最符合，按鍵 Q-R 選最不符</span>
      </div>
    </div>

    <header class="border-b border-gray-200 pb-6 mb-8">
      <h1 id="header-title" class="text-2xl md:text-3xl font-extrabold text-gray-900 tracking-tight">DISC 行為評估報告</h1>
      <p id="header-desc" class="mt-2 text-sm text-gray-500 leading-relaxed print:hidden">
        本測驗包含 24 組特質矩陣（雙面代價設計）。請在每組中挑選 1 個 <strong>[+] 最符合</strong> 與 1 個 <strong>[-] 最不符</strong>。
      </p>

      <!-- 💡 首頁姓名輸入框（選填） -->
      <div class="mt-4 flex flex-col sm:flex-row sm:items-center gap-2 print:hidden">
        <label for="user-name-input" id="label-user-name" class="text-xs font-bold text-gray-600">受測者姓名 (選填)：</label>
        <input type="text" id="user-name-input" placeholder="例如：Alex Wong" maxlength="30" class="text-xs border border-gray-300 rounded-lg px-3 py-1.5 bg-gray-50 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 max-w-xs transition">
      </div>

      <div class="hidden print:block mt-2 text-xs text-gray-500" id="report-stamp-print"></div>
    </header>

    <!-- 測驗區域 -->
    <main id="quiz-container" class="space-y-6 print:hidden">
      <div id="skeleton-loader" class="space-y-4 animate-pulse">
        <div class="p-4 rounded-xl border border-gray-200 bg-gray-100 h-32"></div>
        <div class="p-4 rounded-xl border border-gray-200 bg-gray-100 h-32"></div>
        <div class="p-4 rounded-xl border border-gray-200 bg-gray-100 h-32"></div>
      </div>
      <div id="questions-list" class="space-y-5 hidden"></div>
      <div class="pt-6 border-t border-gray-200 flex justify-end">
        <button id="submit-btn" disabled class="w-full sm:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md disabled:bg-gray-300 disabled:cursor-not-allowed transition transform active:scale-95">
          計算分析結果
        </button>
      </div>
    </main>

    <!-- 結果展示區域 -->
    <section id="result-container" class="hidden mt-6 space-y-6" aria-live="polite">
      <!-- 💡 列印專屬頂部資訊條（含受測者姓名與精準時間戳） -->
      <div id="print-meta-header" class="hidden print:flex justify-between items-center border-b-2 border-gray-800 pb-2 mb-4 text-xs">
        <div><strong id="print-name-label">受測者：</strong><span id="print-user-name" class="font-bold">匿名自評</span></div>
        <div><strong id="print-time-label">評估完成時間：</strong><span id="print-eval-time" class="font-mono">--</span></div>
      </div>

      <!-- 主管版摘要卡 -->
      <div id="executive-summary" class="hidden print:block p-4 bg-gray-50 border border-gray-200 rounded-xl mb-4"></div>

      <div id="quality-warning" class="hidden p-4 rounded-xl text-sm" role="alert"></div>
      <div id="conflict-notice" class="hidden p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-yellow-900 text-xs leading-relaxed"></div>
      <div id="tension-notice" class="hidden p-4 bg-indigo-50 border border-indigo-200 rounded-xl text-indigo-900 text-xs leading-relaxed"></div>

      <!-- 雷達圖容器 -->
      <div id="chart-wrapper" class="bg-gray-50 p-5 rounded-2xl border border-gray-200 min-h-[340px] flex flex-col items-center justify-center">
        <canvas id="discChart" class="max-h-80 w-full" aria-label="DISC Radar Chart" role="img"></canvas>
        <p id="chart-note" class="text-xs text-gray-500 mt-3 text-center leading-relaxed">
          ※ 本圖表採用 0–100 標準化座標；由於迫選幾何約束，四維度總和恆等於 200（基準中線 = 50）。
        </p>
      </div>

      <div id="history-diff-box" class="hidden p-4 bg-gray-50 rounded-xl border border-gray-200"></div>

      <!-- 主導風格與建議 -->
      <div class="p-6 bg-gray-50 rounded-2xl border border-gray-200 space-y-4">
        <h2 id="profile-title" class="text-xl font-extrabold text-gray-900"></h2>
        <div id="profile-desc" class="text-sm text-gray-700 leading-relaxed"></div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-gray-200">
          <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
            <h3 id="dos-title" class="font-bold text-green-700 text-xs mb-2">建議溝通方式 (Dos)</h3>
            <ul id="profile-dos" class="text-xs text-gray-600 space-y-1.5"></ul>
          </div>
          <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
            <h3 id="donts-title" class="font-bold text-red-700 text-xs mb-2">應避免的溝通方式 (Don'ts)</h3>
            <ul id="profile-donts" class="text-xs text-gray-600 space-y-1.5"></ul>
          </div>
        </div>
      </div>

      <!-- 代價承受分析 -->
      <div class="p-5 bg-yellow-50 border border-yellow-200 rounded-2xl">
        <h3 id="cost-title" class="font-bold text-yellow-900 text-sm mb-2">行為代價承受分析 (Cost Tolerance)</h3>
        <div id="cost-summary" class="text-xs text-yellow-900 leading-relaxed"></div>
      </div>

      <!-- 操作按鈕列 -->
      <div class="pt-4 flex flex-col sm:flex-row justify-center gap-3 print:hidden">
        <button id="print-btn" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition shadow-sm">
          列印 / 匯出 PDF 報告
        </button>
        <button id="retake-btn" class="px-6 py-2.5 border border-gray-300 rounded-xl text-gray-600 hover:bg-gray-100 text-sm font-semibold transition">
          重新評測
        </button>
      </div>
    </section>

    <footer class="mt-12 pt-6 border-t border-gray-200 text-xs text-gray-400 space-y-2 leading-relaxed">
      <p id="footer-stamp"></p>
    </footer>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
